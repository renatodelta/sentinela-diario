name: Coletar Diario de SJC

on:
  schedule:
    - cron: "0 11 * * 1-5"
  workflow_dispatch:

jobs:
  coletar-e-sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pdfplumber requests

      - name: Coletar, analisar e sincronizar
        env:
          SENTINELA_WORKER_URL: ${{ secrets.SENTINELA_WORKER_URL }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: python analyzer/coletar_diario_sjc.py
