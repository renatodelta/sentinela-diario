O seu token do GitHub salvo no PC não tem permissão para criar arquivos em .github/workflows/ (falta o escopo workflow).

Você tem duas formas simples de resolver:

Opção 1 — Liberar a permissão workflow no token (mais limpa)
No GitHub, acesse Settings (do seu perfil, não do repo) → Developer settings → Personal access tokens.
Edite o seu token e marque a caixa workflow (ou gere um novo com repo + workflow).
No PowerShell, limpe a credencial antiga e faça o push novamente:
powershell
cmdkey /delete:git:https://github.com
git push -u origin main
Opção 2 — Subir o código sem o arquivo de workflow e criá-lo pelo navegador

Se não quiser mexer em tokens agora, rode:

powershell
git rm -r --cached .github
git commit --amend --no-edit
git push -u origin main

Depois, no site do GitHub, abra a aba Actions → set up a workflow yourself e cole o conteúdo de .github/workflows/diario_sjc.yml.

